name: Gas call (on demand)

# The daily 7am call and the noon check run on the Mac Mini (mac/daily.py).
# This job only runs on demand: the app's "Get new prices" and trip buttons start it.
on:
  workflow_dispatch:
    inputs:
      notify:
        description: Send the push notification
        type: boolean
        default: true
      trip_destination:
        description: Add a road trip to this place (e.g. "Houghton, MI")
        type: string
      trip_date:
        description: Trip date (YYYY-MM-DD)
        type: string
      trip_remove:
        description: ID of a trip to remove
        type: string

permissions:
  contents: write

concurrency: daily-gas-call

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update trips
        if: inputs.trip_destination != '' || inputs.trip_remove != ''
        env:
          TRIP_DESTINATION: ${{ inputs.trip_destination }}
          TRIP_DATE: ${{ inputs.trip_date }}
          TRIP_REMOVE: ${{ inputs.trip_remove }}
        run: |
          if [ -n "$TRIP_REMOVE" ]; then python gas.py trip-remove "$TRIP_REMOVE"; fi
          if [ -n "$TRIP_DESTINATION" ]; then python gas.py trip-add "$TRIP_DESTINATION" "$TRIP_DATE"; fi
      - name: Make the call
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gas.py run ${{ !inputs.notify && '--no-notify' || '' }}
      - name: Save history and page
        if: always()
        run: |
          git config user.name "gas-helper"
          git config user.email "gas-helper@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Daily update"
          # The Mac Mini may have pushed while this job ran.
          git pull --rebase -q
          git push
