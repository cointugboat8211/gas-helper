name: Daily gas call

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving, so fire at both possible
    # "7am Eastern" hours and both possible "noon Eastern" hours; gas.py --scheduled
    # acts on the right ones and skips the others.
    - cron: "3 11 * * *"
    - cron: "3 12 * * *"
    - cron: "3 16 * * *"
    - cron: "3 17 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: Send the push notification
        type: boolean
        default: true

permissions:
  contents: write

concurrency: daily-gas-call

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the call
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # A manual run always runs; the schedule runs once per day. The app's
        # "Get new prices" button starts a manual run with notify off.
        run: >-
          python gas.py run
          ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && !inputs.notify && '--no-notify' || '' }}
      - name: Save history and page
        if: always()
        run: |
          git config user.name "gas-helper"
          git config user.email "gas-helper@users.noreply.github.com"
          git add data/gas.db docs/index.html
          git diff --cached --quiet || git commit -m "Daily update"
          # The Mac Mini may have pushed a fuel reading while this job ran.
          git pull --rebase -q
          git push
